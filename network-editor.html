<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>genre relationship editor</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #f6eee0;
  --black:   #1a1a1a;
  --grey:    #888;
  --border:  2px solid #1a1a1a;
  --thin:    1px solid #1a1a1a;
  --coral:   #e8614a;
  --yellow:  #e8c547;
  --mint:    #7dd4a8;
  --lavender:#b8a0d4;
  --orange:  #f4a24a;
  --font:    'VT323', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  font-family: var(--font);
  font-size: 16px;
  color: var(--black);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
#header {
  background: var(--black);
  color: var(--bg);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: var(--border);
  flex-shrink: 0;
}

#header h1 {
  font-size: 22px;
  letter-spacing: 0.05em;
}

#header-meta {
  font-size: 14px;
  color: #00ff88;
  letter-spacing: 0.08em;
}

/* ── TOOLBAR ── */
#toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-bottom: var(--border);
  background: var(--bg);
  flex-shrink: 0;
}

#search-input {
  font-family: var(--font);
  font-size: 16px;
  border: var(--border);
  background: white;
  padding: 4px 10px;
  width: 260px;
  outline: none;
}
#search-input:focus { border-color: var(--coral); }

.toolbar-btn {
  font-family: var(--font);
  font-size: 15px;
  border: var(--border);
  background: var(--bg);
  padding: 4px 14px;
  cursor: pointer;
  letter-spacing: 0.04em;
}
.toolbar-btn:hover { background: var(--black); color: var(--bg); }
.toolbar-btn.primary { background: var(--black); color: var(--bg); }
.toolbar-btn.primary:hover { background: var(--coral); border-color: var(--coral); color: white; }

#status-msg {
  font-size: 14px;
  color: var(--grey);
  margin-left: auto;
}

/* ── MAIN LAYOUT ── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── LEFT: GENRE LIST ── */
#genre-list-panel {
  width: 260px;
  flex-shrink: 0;
  border-right: var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#genre-list-title {
  font-size: 14px;
  font-weight: bold;
  padding: 6px 12px;
  background: var(--yellow);
  border-bottom: var(--border);
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

#genre-list {
  flex: 1;
  overflow-y: auto;
}

.genre-item {
  padding: 5px 12px;
  border-bottom: var(--thin);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 15px;
}
.genre-item:hover { background: #ede6d4; }
.genre-item.active { background: var(--black); color: var(--bg); }
.genre-item .g-count {
  font-size: 12px;
  color: var(--grey);
  margin-left: 6px;
}
.genre-item.active .g-count { color: #aaa; }
.genre-item .g-cluster {
  font-size: 11px;
  padding: 1px 5px;
  border: 1px solid currentColor;
  opacity: 0.6;
  white-space: nowrap;
}

/* ── CENTER: EDITOR ── */
#editor-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

#editor-header {
  padding: 12px 20px;
  border-bottom: var(--border);
  background: var(--mint);
  flex-shrink: 0;
  display: flex;
  align-items: baseline;
  gap: 16px;
}

#editor-genre-name {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 0.04em;
}

#editor-genre-meta {
  font-size: 14px;
  color: #1a5a3a;
}

#editor-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* ── RELATIONSHIP SECTIONS ── */
.rel-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rel-section-title {
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 0.05em;
  border-bottom: var(--thin);
  padding-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.rel-section-title .section-badge {
  font-size: 12px;
  padding: 2px 8px;
  border: var(--thin);
  font-weight: normal;
  color: var(--grey);
}

.rel-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border: var(--thin);
  background: white;
}

.rel-row:hover { border-color: var(--black); }

.rel-arrow {
  font-size: 18px;
  color: var(--grey);
  flex-shrink: 0;
  width: 24px;
  text-align: center;
}

.rel-genre-name {
  font-size: 16px;
  font-weight: bold;
  flex: 1;
  min-width: 120px;
}

.rel-type-select {
  font-family: var(--font);
  font-size: 14px;
  border: var(--thin);
  background: var(--bg);
  padding: 2px 6px;
  cursor: pointer;
  outline: none;
  width: 110px;
}

.rel-weight-input {
  font-family: var(--font);
  font-size: 14px;
  border: var(--thin);
  background: var(--bg);
  padding: 2px 6px;
  width: 52px;
  outline: none;
}

.rel-delete-btn {
  font-family: var(--font);
  font-size: 14px;
  border: var(--thin);
  background: transparent;
  padding: 2px 8px;
  cursor: pointer;
  color: var(--coral);
  flex-shrink: 0;
}
.rel-delete-btn:hover { background: var(--coral); color: white; border-color: var(--coral); }

/* type color indicators */
.type-origin    { border-left: 4px solid #e8614a; }
.type-subgenre  { border-left: 4px solid #7dd4a8; }
.type-fusion    { border-left: 4px solid #b8a0d4; }
.type-influence { border-left: 4px solid #e8c547; }

/* ── ADD RELATIONSHIP ── */
.add-rel-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
}

.add-genre-input {
  font-family: var(--font);
  font-size: 15px;
  border: var(--border);
  background: white;
  padding: 4px 8px;
  flex: 1;
  outline: none;
  position: relative;
}
.add-genre-input:focus { border-color: var(--black); }

.add-type-select {
  font-family: var(--font);
  font-size: 14px;
  border: var(--border);
  background: var(--bg);
  padding: 4px 6px;
  cursor: pointer;
  outline: none;
  width: 120px;
}

.add-btn {
  font-family: var(--font);
  font-size: 15px;
  border: var(--border);
  background: var(--black);
  color: var(--bg);
  padding: 4px 14px;
  cursor: pointer;
  white-space: nowrap;
}
.add-btn:hover { background: var(--mint); border-color: var(--mint); color: var(--black); }

/* autocomplete */
#autocomplete {
  position: fixed;
  background: white;
  border: var(--border);
  z-index: 1000;
  max-height: 200px;
  overflow-y: auto;
  display: none;
  min-width: 200px;
}

.ac-item {
  padding: 5px 10px;
  font-family: var(--font);
  font-size: 15px;
  cursor: pointer;
  border-bottom: var(--thin);
}
.ac-item:hover { background: var(--black); color: var(--bg); }

/* ── EMPTY STATE ── */
#editor-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--grey);
  font-size: 20px;
  line-height: 2;
  text-align: center;
}

/* ── LEGEND ── */
#legend {
  padding: 8px 20px;
  border-top: var(--thin);
  background: var(--bg);
  display: flex;
  gap: 20px;
  align-items: center;
  flex-shrink: 0;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--grey);
}

.legend-dot {
  width: 12px;
  height: 12px;
  flex-shrink: 0;
}

/* scrollbars */
::-webkit-scrollbar { width: 12px; }
::-webkit-scrollbar-track { background: var(--bg); border-left: var(--thin); }
::-webkit-scrollbar-thumb { background: var(--black); }

/* unsaved indicator */
.unsaved { color: var(--coral) !important; }
</style>
</head>
<body>

<div id="header">
  <h1>genre relationship editor</h1>
  <span id="header-meta">my listening map</span>
</div>

<div id="toolbar">
  <input type="text" id="search-input" placeholder="search genres..." autocomplete="off">
  <button class="toolbar-btn" id="btn-show-all">show all</button>
  <button class="toolbar-btn" id="btn-show-unconnected">unconnected only</button>
  <button class="toolbar-btn primary" id="btn-export">export edges.csv</button>
  <span id="status-msg">loading...</span>
</div>

<div id="main">

  <!-- GENRE LIST -->
  <div id="genre-list-panel">
    <div id="genre-list-title">genres <span id="genre-count"></span></div>
    <div id="genre-list"></div>
  </div>

  <!-- EDITOR -->
  <div id="editor-panel">
    <div id="editor-empty">
      ← select a genre to edit its relationships
    </div>
    <div id="editor-content" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
      <div id="editor-header">
        <span id="editor-genre-name"></span>
        <span id="editor-genre-meta"></span>
      </div>
      <div id="editor-body">

        <!-- PARENTS section -->
        <div class="rel-section" id="section-parents">
          <div class="rel-section-title">
            this genre comes from
            <span class="section-badge" id="parents-count">0 relationships</span>
          </div>
          <div id="parents-list"></div>
          <div class="add-rel-row">
            <input class="add-genre-input" id="add-parent-input" placeholder="add parent genre..." autocomplete="off">
            <select class="add-type-select" id="add-parent-type">
              <option value="origin">origin</option>
              <option value="subgenre">subgenre</option>
              <option value="fusion">fusion</option>
              <option value="influence">influence</option>
            </select>
            <button class="add-btn" id="btn-add-parent">+ add</button>
          </div>
        </div>

        <!-- CHILDREN section -->
        <div class="rel-section" id="section-children">
          <div class="rel-section-title">
            this genre leads to
            <span class="section-badge" id="children-count">0 relationships</span>
          </div>
          <div id="children-list"></div>
          <div class="add-rel-row">
            <input class="add-genre-input" id="add-child-input" placeholder="add child genre..." autocomplete="off">
            <select class="add-type-select" id="add-child-type">
              <option value="subgenre">subgenre</option>
              <option value="origin">origin</option>
              <option value="fusion">fusion</option>
              <option value="influence">influence</option>
            </select>
            <button class="add-btn" id="btn-add-child">+ add</button>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>

<!-- LEGEND -->
<div id="legend">
  <span style="font-size:14px;color:var(--black);font-weight:bold;">edge types:</span>
  <div class="legend-item"><div class="legend-dot" style="background:#e8614a"></div>origin</div>
  <div class="legend-item"><div class="legend-dot" style="background:#7dd4a8"></div>subgenre</div>
  <div class="legend-item"><div class="legend-dot" style="background:#b8a0d4"></div>fusion</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e8c547"></div>influence</div>
  <span id="unsaved-count" style="margin-left:auto;font-size:14px;"></span>
</div>

<!-- AUTOCOMPLETE -->
<div id="autocomplete"></div>

<script>
// ── STATE ──
var nodes = []
var edges = []
var nodeIds = []
var currentGenre = null
var unsavedChanges = 0
var filterMode = 'all' // 'all' | 'unconnected'
var searchQuery = ''

// ── CLUSTER COLORS ──
var CLUSTER_COLORS = {
  'caribe':'#e8614a','afro-sudamericano':'#e8c547','andina':'#b8a0d4',
  'cancion':'#f4a0b8','brasileira':'#7dd4a8','rock-latino':'#f4a24a',
  'hip-hop-latino':'#c8a0f4','jazz':'#60a5fa','soul-rnb-funk':'#f472b6',
  'hip-hop':'#94a3b8','rock':'#ef4444','electronic':'#22d3ee',
  'african-global-roots':'#fbbf24','folk-singer-songwriter':'#86efac',
  'classical-experimental':'#c4b5fd','pop-indie':'#fdba74','ancestor':'#cccccc'
}

// ── CSV PARSING ──
function parseCSV(text) {
  var lines = text.trim().split('\n')
  var headers = lines[0].split(',').map(function(h) { return h.trim().replace(/\r/g,'') })
  return lines.slice(1).map(function(line) {
    var vals = line.split(',').map(function(v) { return v.trim().replace(/\r/g,'') })
    var obj = {}
    headers.forEach(function(h,i) { obj[h] = vals[i] || '' })
    return obj
  })
}

function edgesToCSV(edgeList) {
  var lines = ['source,target,type,weight']
  edgeList.forEach(function(e) {
    lines.push([e.source, e.target, e.type, e.weight].join(','))
  })
  return lines.join('\n')
}

// ── LOAD ──
function loadData() {
  setStatus('loading...')
  Promise.all([
    fetch('data/nodes.csv').then(function(r) { return r.text() }),
    fetch('data/edges.csv').then(function(r) { return r.text() })
  ]).then(function(files) {
    nodes = parseCSV(files[0])
    edges = parseCSV(files[1])
    nodeIds = nodes.map(function(n) { return n.id })
    setStatus(nodes.length + ' genres · ' + edges.length + ' relationships loaded')
    renderGenreList()
  }).catch(function(err) {
    setStatus('error: ' + err.message)
  })
}

// ── STATUS ──
function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg
}

function updateUnsaved() {
  var el = document.getElementById('unsaved-count')
  if (unsavedChanges > 0) {
    el.textContent = unsavedChanges + ' unsaved changes'
    el.className = 'unsaved'
  } else {
    el.textContent = ''
    el.className = ''
  }
}

// ── GENRE LIST ──
function getConnectedIds() {
  var connected = new Set()
  edges.forEach(function(e) { connected.add(e.source); connected.add(e.target) })
  return connected
}

function renderGenreList() {
  var list = document.getElementById('genre-list')
  var connected = getConnectedIds()

  var filtered = nodes.filter(function(n) {
    var matchesSearch = !searchQuery || n.id.toLowerCase().includes(searchQuery.toLowerCase())
    var matchesFilter = filterMode === 'all' || !connected.has(n.id)
    return matchesSearch && matchesFilter
  })

  // sort: by song count desc, then alpha
  filtered.sort(function(a,b) {
    var diff = (parseInt(b.song_count)||0) - (parseInt(a.song_count)||0)
    return diff !== 0 ? diff : a.id.localeCompare(b.id)
  })

  document.getElementById('genre-count').textContent = '(' + filtered.length + ')'

  list.innerHTML = filtered.map(function(n) {
    var count = parseInt(n.song_count) || 0
    var color = CLUSTER_COLORS[n.cluster] || '#ccc'
    var isActive = currentGenre && currentGenre.id === n.id
    return '<div class="genre-item' + (isActive ? ' active' : '') + '" data-id="' + n.id + '">' +
      '<span>' + n.id + (count > 0 ? '<span class="g-count">(' + count + ')</span>' : '') + '</span>' +
      '<span class="g-cluster" style="border-color:' + color + ';color:' + (isActive ? '#aaa' : color) + '">' + (n.cluster||'?') + '</span>' +
      '</div>'
  }).join('')

  list.querySelectorAll('.genre-item').forEach(function(el) {
    el.addEventListener('click', function() {
      var id = el.getAttribute('data-id')
      var node = nodes.find(function(n) { return n.id === id })
      if (node) selectGenre(node)
    })
  })
}

// ── SELECT GENRE ──
function selectGenre(node) {
  currentGenre = node
  renderGenreList()
  renderEditor()
}

// ── EDITOR ──
function renderEditor() {
  if (!currentGenre) return

  document.getElementById('editor-empty').style.display = 'none'
  var content = document.getElementById('editor-content')
  content.style.display = 'flex'

  var count = parseInt(currentGenre.song_count) || 0
  document.getElementById('editor-genre-name').textContent = currentGenre.id
  document.getElementById('editor-genre-meta').textContent =
    currentGenre.cluster + (count > 0 ? ' · ' + count + ' songs' : ' · root node')

  // parents = edges where target === currentGenre.id
  var parents = edges.filter(function(e) { return e.target === currentGenre.id })
  // children = edges where source === currentGenre.id
  var children = edges.filter(function(e) { return e.source === currentGenre.id })

  document.getElementById('parents-count').textContent = parents.length + ' relationship' + (parents.length !== 1 ? 's' : '')
  document.getElementById('children-count').textContent = children.length + ' relationship' + (children.length !== 1 ? 's' : '')

  renderRelList('parents-list', parents, 'parent')
  renderRelList('children-list', children, 'child')
}

function typeClass(type) {
  return 'type-' + (type || 'influence')
}

function renderRelList(containerId, rels, direction) {
  var container = document.getElementById(containerId)
  if (rels.length === 0) {
    container.innerHTML = '<div style="padding:6px 10px;color:var(--grey);font-size:14px;">none yet</div>'
    return
  }

  container.innerHTML = rels.map(function(e, i) {
    var otherGenre = direction === 'parent' ? e.source : e.target
    var arrow = direction === 'parent' ? '←' : '→'
    return '<div class="rel-row ' + typeClass(e.type) + '" data-idx="' + i + '">' +
      '<span class="rel-arrow">' + arrow + '</span>' +
      '<span class="rel-genre-name">' + otherGenre + '</span>' +
      '<select class="rel-type-select" data-field="type">' +
        ['origin','subgenre','fusion','influence'].map(function(t) {
          return '<option value="' + t + '"' + (e.type === t ? ' selected' : '') + '>' + t + '</option>'
        }).join('') +
      '</select>' +
      '<input class="rel-weight-input" type="number" min="0" max="1" step="0.1" value="' + (e.weight||0.7) + '" data-field="weight">' +
      '<button class="rel-delete-btn" data-direction="' + direction + '" data-source="' + e.source + '" data-target="' + e.target + '">delete</button>' +
      '</div>'
  }).join('')

  // wire up changes
  container.querySelectorAll('.rel-type-select').forEach(function(sel) {
    sel.addEventListener('change', function() {
      var row = sel.closest('.rel-row')
      var deleteBtn = row.querySelector('.rel-delete-btn')
      var src = deleteBtn.getAttribute('data-source')
      var tgt = deleteBtn.getAttribute('data-target')
      updateEdge(src, tgt, 'type', sel.value)
      row.className = 'rel-row ' + typeClass(sel.value)
    })
  })

  container.querySelectorAll('.rel-weight-input').forEach(function(inp) {
    inp.addEventListener('change', function() {
      var row = inp.closest('.rel-row')
      var deleteBtn = row.querySelector('.rel-delete-btn')
      updateEdge(deleteBtn.getAttribute('data-source'), deleteBtn.getAttribute('data-target'), 'weight', inp.value)
    })
  })

  container.querySelectorAll('.rel-delete-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var src = btn.getAttribute('data-source')
      var tgt = btn.getAttribute('data-target')
      deleteEdge(src, tgt)
    })
  })
}

// ── EDGE OPERATIONS ──
function updateEdge(source, target, field, value) {
  var edge = edges.find(function(e) { return e.source === source && e.target === target })
  if (edge) {
    edge[field] = value
    unsavedChanges++
    updateUnsaved()
    setStatus('updated: ' + source + ' → ' + target)
  }
}

function deleteEdge(source, target) {
  var before = edges.length
  edges = edges.filter(function(e) { return !(e.source === source && e.target === target) })
  if (edges.length < before) {
    unsavedChanges++
    updateUnsaved()
    setStatus('deleted: ' + source + ' → ' + target)
    renderEditor()
    renderGenreList()
  }
}

function addEdge(source, target, type, weight) {
  // check doesn't already exist
  var exists = edges.some(function(e) { return e.source === source && e.target === target })
  if (exists) { setStatus('relationship already exists'); return false }
  if (!nodeIds.includes(source)) { setStatus('genre not found: ' + source); return false }
  if (!nodeIds.includes(target)) { setStatus('genre not found: ' + target); return false }
  if (source === target) { setStatus('cannot connect a genre to itself'); return false }

  edges.push({ source: source, target: target, type: type, weight: weight || '0.7' })
  unsavedChanges++
  updateUnsaved()
  setStatus('added: ' + source + ' → ' + target + ' (' + type + ')')
  renderEditor()
  renderGenreList()
  return true
}

// ── ADD RELATIONSHIP BUTTONS ──
document.getElementById('btn-add-parent').addEventListener('click', function() {
  var input = document.getElementById('add-parent-input')
  var type  = document.getElementById('add-parent-type').value
  var parentGenre = input.value.trim().toLowerCase()
  if (!parentGenre || !currentGenre) return
  // find exact match (case insensitive)
  var match = nodeIds.find(function(id) { return id.toLowerCase() === parentGenre })
  if (!match) { setStatus('genre not found: ' + parentGenre); return }
  if (addEdge(match, currentGenre.id, type, '0.7')) {
    input.value = ''
    hideAutocomplete()
  }
})

document.getElementById('btn-add-child').addEventListener('click', function() {
  var input = document.getElementById('add-child-input')
  var type  = document.getElementById('add-child-type').value
  var childGenre = input.value.trim().toLowerCase()
  if (!childGenre || !currentGenre) return
  var match = nodeIds.find(function(id) { return id.toLowerCase() === childGenre })
  if (!match) { setStatus('genre not found: ' + childGenre); return }
  if (addEdge(currentGenre.id, match, type, '0.7')) {
    input.value = ''
    hideAutocomplete()
  }
})

// enter key on inputs
document.getElementById('add-parent-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('btn-add-parent').click()
})
document.getElementById('add-child-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('btn-add-child').click()
})

// ── AUTOCOMPLETE ──
function setupAutocomplete(inputId) {
  var input = document.getElementById(inputId)
  input.addEventListener('input', function() {
    var q = input.value.trim().toLowerCase()
    if (!q || q.length < 2) { hideAutocomplete(); return }
    var matches = nodeIds.filter(function(id) { return id.toLowerCase().includes(q) }).slice(0, 12)
    if (!matches.length) { hideAutocomplete(); return }
    showAutocomplete(input, matches)
  })
  input.addEventListener('blur', function() {
    setTimeout(hideAutocomplete, 150)
  })
}

function showAutocomplete(input, matches) {
  var ac = document.getElementById('autocomplete')
  var rect = input.getBoundingClientRect()
  ac.style.left = rect.left + 'px'
  ac.style.top  = (rect.bottom + 2) + 'px'
  ac.style.width = rect.width + 'px'
  ac.style.display = 'block'
  ac.innerHTML = matches.map(function(m) {
    return '<div class="ac-item" data-value="' + m + '">' + m + '</div>'
  }).join('')
  ac.querySelectorAll('.ac-item').forEach(function(item) {
    item.addEventListener('mousedown', function() {
      input.value = item.getAttribute('data-value')
      hideAutocomplete()
    })
  })
}

function hideAutocomplete() {
  document.getElementById('autocomplete').style.display = 'none'
}

setupAutocomplete('add-parent-input')
setupAutocomplete('add-child-input')

// ── SEARCH ──
document.getElementById('search-input').addEventListener('input', function() {
  searchQuery = this.value
  renderGenreList()
})

// ── FILTER BUTTONS ──
document.getElementById('btn-show-all').addEventListener('click', function() {
  filterMode = 'all'
  renderGenreList()
  setStatus('showing all genres')
})

document.getElementById('btn-show-unconnected').addEventListener('click', function() {
  filterMode = 'unconnected'
  renderGenreList()
  var connected = getConnectedIds()
  var unconnected = nodes.filter(function(n) { return !connected.has(n.id) }).length
  setStatus(unconnected + ' genres with no relationships yet')
})

// ── EXPORT ──
document.getElementById('btn-export').addEventListener('click', function() {
  var csv = edgesToCSV(edges)
  var blob = new Blob([csv], { type: 'text/csv' })
  var url = URL.createObjectURL(blob)
  var a = document.createElement('a')
  a.href = url
  a.download = 'edges.csv'
  a.click()
  URL.revokeObjectURL(url)
  unsavedChanges = 0
  updateUnsaved()
  setStatus('exported edges.csv — ' + edges.length + ' relationships')
})

// ── INIT ──
loadData()
</script>
</body>
