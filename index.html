<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>my listening map</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
</head>
<body>

  <!-- GLOBAL HEADER -->
  <div id="global-header">
    <div id="global-header-left">
      <button class="nav-btn" id="nav-back" title="back" disabled>&#8592;</button>
      <button class="nav-btn" id="nav-forward" title="forward" disabled>&#8594;</button>
    </div>
    <span id="global-title">my listening map</span>
    <div id="global-header-right">
      <button id="reset-all-btn">reset all filters</button>
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div id="app-layout">

    <!-- LEFT COLUMN: viz panels stacked -->
    <div id="viz-column">

      <!-- MAP PANEL (top) -->
      <div class="win-panel viz-panel" id="map-panel">
        <div class="win-titlebar" id="map-titlebar">
          <span class="win-titlebar-text">map</span>
          <span class="win-titlebar-meta" id="map-status">loading...</span>
          <button class="panel-reset-btn" id="map-reset-btn">reset</button>
        </div>
        <div id="map"></div>
      </div>

      <!-- NETWORK PANEL (bottom) -->
      <div class="win-panel viz-panel" id="network-panel">
        <div class="win-titlebar" id="network-titlebar">
          <span class="win-titlebar-text">genre network</span>
          <span class="win-titlebar-meta" id="network-status">loading...</span>
          <button class="panel-reset-btn" id="network-reset-btn">reset</button>
        </div>
        <div id="network-container">
          <svg id="network-svg"></svg>
          <div id="network-tooltip"></div>
          <div id="network-hint">drag · scroll · click node to explore · click edge for details</div>

          <!-- GENRE SEARCH -->
          <div id="genre-search-wrap">
            <input type="text" id="genre-search-input" placeholder="search genres..." autocomplete="off">
            <div id="genre-search-results"></div>
          </div>

          <!-- LEGEND -->
          <div id="network-legend">
            <div id="network-legend-titlebar">
              <span id="network-legend-title">legend</span>
              <button class="net-legend-btn" id="legend-toggle">−</button>
            </div>
            <div id="network-legend-body">
              <div class="legend-section-label">clusters</div>
              <div id="legend-clusters"></div>
              <div class="legend-section-label" style="margin-top:8px;">edge types</div>
              <div class="legend-edges" id="legend-edges">
                <div class="legend-edge-item" data-edge-type="origin"><span class="legend-line origin-line"></span>origin</div>
                <div class="legend-edge-item" data-edge-type="subgenre"><span class="legend-line subgenre-line"></span>subgenre</div>
                <div class="legend-edge-item" data-edge-type="influence"><span class="legend-line influence-line"></span>influence</div>
              </div>
            </div>
          </div>

          <!-- EDGE TOOLTIP -->
          <div id="edge-tooltip"></div>

          <!-- GENRE OVERLAY -->
          <div id="genre-overlay" class="genre-overlay collapsed">
            <div id="genre-overlay-header">
              <div id="genre-overlay-nav">
                <button id="overlay-back-btn" class="overlay-nav-btn" disabled>← back</button>
                <div id="genre-overlay-title-wrap">
                  <span id="genre-overlay-dot"></span>
                  <span id="genre-overlay-name"></span>
                  <span id="genre-overlay-meta"></span>
                </div>
              </div>
              <button id="overlay-close-btn" class="overlay-nav-btn">✕</button>
            </div>
            <div id="genre-overlay-body">
              <div class="overlay-section">
                <div class="overlay-section-title" id="overlay-parents-title">comes from</div>
                <div class="overlay-cards" id="overlay-parents"></div>
              </div>
              <div class="overlay-section">
                <div class="overlay-section-title" id="overlay-children-title">leads to</div>
                <div class="overlay-cards" id="overlay-children"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div><!-- end viz-column -->

    <!-- RIGHT COLUMN: songs panel only -->
    <div id="songs-column">

      <!-- SONGS PANEL -->
      <div class="win-panel" id="songs-panel">
        <div class="win-titlebar">
          <span class="win-titlebar-text" id="songs-title">songs</span>
        </div>

        <!-- SEARCH BAR -->
        <div id="songs-controls">
          <input type="text" id="songs-search" placeholder="search artist, song..." autocomplete="off">
        </div>

        <!-- TABLE -->
        <div class="songs-scroll-wrap">
          <div class="songs-table-container" id="songs-table-container">
            <table id="songs-table">
              <thead>
                <tr id="songs-thead-row">
                  <th class="col-fixed col-title">
                    <div class="th-inner">title <span class="sort-arrows" data-sort="title"><span class="arr-up">△</span><span class="arr-dn">▽</span></span></div>
                  </th>
                  <th class="col-artist">
                    <div class="th-inner">artist <span class="sort-arrows" data-sort="artist"><span class="arr-up">△</span><span class="arr-dn">▽</span></span></div>
                  </th>
                  <th class="col-year">
                    <div class="th-inner">year <span class="sort-arrows" data-sort="year"><span class="arr-up">△</span><span class="arr-dn">▽</span></span></div>
                  </th>
                  <th class="col-genre">
                    <div class="th-inner">genre <span class="sort-arrows" data-sort="genre"><span class="arr-up">△</span><span class="arr-dn">▽</span></span></div>
                  </th>
                  <th class="col-influence" style="display:none">influence</th>
                  <th class="col-country">
                    <div class="th-inner">country <span class="sort-arrows" data-sort="country"><span class="arr-up">△</span><span class="arr-dn">▽</span></span></div>
                  </th>
                </tr>
              </thead>
              <tbody id="songs-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- SONGS COUNT (always visible below table) -->
        <div class="songs-footer" id="songs-footer"></div>

        <!-- DECADE RANGE FILTER -->
        <div id="decade-filter">
          <div id="decade-filter-header">
            <span class="win-titlebar-text">decades</span>
            <span class="win-titlebar-meta" id="decade-range-label"></span>
            <button id="decade-reset" title="reset decade filter">reset</button>
          </div>
          <div id="decade-slider-wrap">
            <div id="decade-track">
              <div id="decade-fill"></div>
              <div class="decade-thumb" id="thumb-min" data-thumb="min"></div>
              <div class="decade-thumb" id="thumb-max" data-thumb="max"></div>
            </div>
            <div id="decade-ticks"></div>
          </div>
        </div>

      </div>

    </div><!-- end songs-column -->

  </div><!-- end app-layout -->

  <!-- BOTTOM BAR -->
  <div id="bottom-bar">
    <span id="bottom-status">loading...</span>
    <span id="bottom-credit">by valentina orjuela</span>
  </div>

  <script src="network.js"></script>
  <script src="app.js"></script>
</body>
</html>
